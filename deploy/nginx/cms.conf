# =============================================================================
# Nginx — origen del CMS Strapi en EC2, detrás de Cloudflare
# =============================================================================
# Flujo:  Internet ── HTTPS ──> Cloudflare ── HTTPS ──> este Nginx (:443)
#                                          ── proxy ──> Strapi :1337 (PM2)
#
# TLS de origen: certificado **Cloudflare Origin CA** en /etc/ssl/cloudflare/
# (comodín *.asociacionzonasfrancas.org + apex, válido hasta 2041). Solo lo
# confía Cloudflare, no los navegadores — por eso todo debe pasar por el proxy.
#
# OJO con el certificado: esta instancia tenía uno de oct 2025 que parecía
# correcto con `openssl x509` —en vigor, SAN bueno, clave coincidente— pero que
# Cloudflare RECHAZA en Full (strict) con un 526, casi seguro por estar
# revocado al emitirse el de jul 2026. El que funciona es el mismo par que usa
# el front. Si vuelve a aparecer un 526, sospechar del certificado antes que de
# nginx, y probar con el par del otro origen de la zona.
#
# Instalar en /etc/nginx/sites-available/azfacms y enlazar a sites-enabled.
#
# -----------------------------------------------------------------------------
# ORDEN DE APLICACIÓN — importante
# -----------------------------------------------------------------------------
# El puerto 80 sigue sirviendo la aplicación (no redirige) a propósito: hasta
# ahora este subdominio estaba en modo **Flexible** en Cloudflare, es decir el
# edge hablaba con el origen por HTTP. Si el 80 redirigiese a HTTPS antes de
# cambiar Cloudflare, el CMS quedaría en un bucle de redirecciones.
#
#   1. Aplicar este fichero (añade el :443 sin tocar el :80).
#   2. Verificar el origen:  curl -k --resolve cms…:443:<IP> https://cms…/_health
#   3. En Cloudflare, pasar cms.asociacionzonasfrancas.org a **Full (strict)**
#      y quitar la Configuration Rule de excepción a Flexible.
#   4. Solo entonces, descomentar la redirección del bloque :80 de abajo y
#      recargar. Antes no.
#
# Pendiente aparte, en consola de AWS: restringir el security group a los
# rangos publicados de Cloudflare en 80/443, para que el origen deje de ser
# alcanzable por IP. Y activar Authenticated Origin Pulls.
# =============================================================================

# IP real del visitante: detrás del proxy, $remote_addr es la IP del edge de
# Cloudflare; la del cliente llega en CF-Connecting-IP. Fallback a $remote_addr
# para accesos que no pasen por Cloudflare.
map $http_cf_connecting_ip $cms_client_ip {
  ""      $remote_addr;
  default $http_cf_connecting_ip;
}

# ---- HTTP :80 ---------------------------------------------------------------
server {
  listen 80;
  listen [::]:80;
  server_name cms.asociacionzonasfrancas.org;

  # PASO 4: descomentar SOLO después de pasar Cloudflare a Full (strict).
  # return 301 https://$host$request_uri;

  location / {
    proxy_pass http://127.0.0.1:1337;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $cms_client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # El edge ya sirvió al usuario por HTTPS; se lo decimos a Strapi, que corre
    # con IS_PROXIED=true y necesita el esquema real para construir sus URLs.
    proxy_set_header X-Forwarded-Proto https;
    proxy_cache_bypass $http_upgrade;
    # Subidas grandes al panel: el límite efectivo es el client_max_body_size
    # global de nginx.conf (100M). Los timeouts se alinean con los de
    # config/server.ts (requestTimeout 10 min).
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }
}

# ---- HTTPS :443 — TLS de origen --------------------------------------------
server {
  # nginx 1.24 (Ubuntu 24.04): el http/2 se activa en la propia directiva
  # `listen`. La forma `http2 on;` es de 1.25.1 en adelante y aquí rompe
  # `nginx -t`.
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name cms.asociacionzonasfrancas.org;

  ssl_certificate     /etc/ssl/cloudflare/origin.crt;
  ssl_certificate_key /etc/ssl/cloudflare/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  location / {
    proxy_pass http://127.0.0.1:1337;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $cms_client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }
}
